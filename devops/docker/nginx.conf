# Serves the SPA and reverse-proxies API traffic to FastAPI, so the browser sees one origin (no CORS).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location ~ ^/(api|health|metrics|docs|redoc|openapi.json) {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }   # client-side routing
}
