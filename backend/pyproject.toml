[project]
name = "tableflow-backend"
version = "1.0.0"
requires-python = ">=3.12"
authors = [{ name = "Ria Rampersad" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["regression: guards against previously-found defects or high-risk behaviour"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101", "S105", "S106", "S311", "B008", "E741", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501", "E702"]
"app/seed.py" = ["E501", "E702"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]
